
{% extends "base.html" %}

{% block title %}Sign Up | PrepMaster{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>

        <p>Start your interview preparation journey.</p>

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <button type="submit" class="primary-btn full-width">
                Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
