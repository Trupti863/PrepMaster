
{% extends "base.html" %}

{% block title %}Generate Quiz | PrepMaster{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <span class="tag">AI POWERED QUIZ</span>

        <h1>Generate Your Quiz</h1>

        <p>Practice interview questions generated by AI.</p>

        <form method="POST" action="{{ url_for('generate_quiz') }}">

            <!-- Selected subject is passed automatically -->
            <input
                type="hidden"
                name="subject"
                value="{{ subject }}"
            >

            <label for="topic">Enter Topic</label>

            <input
                type="text"
                id="topic"
                name="topic"
                placeholder="Example: Percentages"
                maxlength="100"
                required
            >

            <label for="difficulty">Select Difficulty</label>

            <select id="difficulty" name="difficulty" required>
                <option value="">Select Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <label for="number">Number of Questions</label>

            <select id="number" name="number" required>
                <option value="5">5 Questions</option>
                <option value="10">10 Questions</option>
            </select>

            <button type="submit" class="primary-btn full-width">
                Generate Quiz
            </button>

        </form>

    </div>

</div>

{% endblock %}
